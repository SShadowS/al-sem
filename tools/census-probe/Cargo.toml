[package]
name = "census-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
al-sem = { path = "../.." }
# Large-allocation log: frames captured unresolved, resolved only when printed.
backtrace = "=0.3.76"
# `front-seq`: the child's status and ask params.
serde_json = "1"
# `refresh-seq`'s `PROBE_COLLECT`: a collect on every global-pool thread.
rayon = "1.12"
# `--features mimalloc`: the counting allocator forwards to mimalloc (purge
# delay 0, as `alsem` sets it) instead of `System`, so `refresh-seq`'s RSS is
# the resident child's allocator's. The versions of the repo's lock.
mimalloc = { version = "=0.1.52", optional = true }
libmimalloc-sys = { version = "=0.1.49", features = ["extended"], optional = true }

[features]
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

# Own workspace: the probe must not join the repo's workspace or CI.
[workspace]

# Mirrors the repo's `release-fast` profile (thin LTO).
[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
# Names the frames of the large-allocation log's backtraces.
debug = "line-tables-only"

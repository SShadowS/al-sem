[package]
# The crate is `al-sem` — the whole-program semantic engine. The call-hierarchy LSP
# server is one CONSUMER of it (and keeps its own binary name below, because three
# external packages spawn that binary by name). The repo carried the consumer's name
# until the 2026-08-07 rename; the library name now matches what the engine is.
name = "al-sem"
default-run = "al-call-hierarchy"
version = "1.7.1"
edition = "2024"
authors = ["SShadowS"]
description = "Whole-program semantic analysis engine for AL (Microsoft Dynamics 365 Business Central): call-graph resolution, an LSP server, and a code-quality analyzer"
license = "GPL-3.0"
repository = "https://github.com/SShadowS/al-sem"

# Owned-syntax-IR migration (Phase 5 — SEALED): `al-syntax` is the ONLY crate that
# compiles + links the tree-sitter grammar. This engine/CLI crate consumes the owned
# IR (`al_syntax::parse`) exclusively and no longer depends on `tree-sitter`.
[workspace]
members = ["crates/al-syntax", "crates/xtask"]

[dependencies]
# The grammar boundary crate (FFI + generated raw layer / lowerer / owned IR).
al-syntax = { path = "crates/al-syntax" }

# Parallelism
rayon = "1.12"

# Global allocator for the `alsem` CLI ONLY (installed in `src/bin/alsem.rs`, not
# in the library — the LSP server, the benches and every test keep the platform
# default). The analyze path is allocation-bound end to end and the 8020 profile
# measured 16.6 % of the run inside `free()` alone.
mimalloc = "0.1"
# `extended` exposes `mi_option_set` — `alsem` sets `purge_delay = 0` so the
# allocator does not hold freed pages. Without it mimalloc is a peak-RSS
# REGRESSION on a small workspace (DO 1,598 -> 1,717 MB); with it, it is a win on
# both corpora. See `src/bin/alsem.rs`.
libmimalloc-sys = { version = "0.1", features = ["extended"] }

# LSP
lsp-server = "0.10"
lsp-types = "0.97"

# Data structures
string-interner = "0.20"
smallvec = "1.16"
# Perfect-hash intrinsic built-in catalog (call-graph resolution phase 2). The AL
# record + framework built-ins are COMPILER INTRINSICS (not in any .app
# SymbolReference.json), so the catalog is a hand-built, data-driven asset kept
# separate from the .app symbol pool. `macros` enables the compile-time phf_map!/phf_set!.
phf = { version = "0.14", features = ["macros"] }

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }

# YAML — policy file loader (cli-c/c2). serde_yaml is the battle-tested, widely
# vendored YAML data format for serde. We deserialize into `serde_yaml::Value`
# (insertion-order Mapping) and walk it manually to reproduce al-sem's OWN
# validation error strings verbatim (the eemeli `yaml` v2 / loadPolicyFromString
# contract). Library-level parse errors are NOT byte-matched (no differential
# feeds malformed YAML).
serde_yaml = "0.9"

# Regex — policy glob compiler (cli-c/c2). The hand-rolled backtracking glob matcher
# was catastrophically exponential (ReDoS) AND stack-overflowed on long inputs. The
# `regex` crate is non-backtracking (linear, no recursion), so a malicious user policy
# glob can never hang or abort the engine. We translate al-sem's `globToRegExp`
# (`new RegExp('^'+escaped+'$','i')`) faithfully (see policy `glob_compile`).
regex = "1"

# Dependency-pack persistence (`src/program/pack`). Non-self-describing, varint
# framed — field names never reach the wire, which is the whole reason a pack of
# ~127k routines is worth writing at all. `use-std` for `to_stdvec`.
postcard = { version = "1", features = ["use-std"] }

# Hashing (R0 identity encoders and snapshot content identity)
sha2 = "0.11"
blake3 = { version = "1" }
# Keyed hashing (1B.3b Task 1: domain-separated anonymization of CDO goldens —
# HMAC over sha2, NOT a fixed salt; see src/program/resolve/anon.rs).
hmac = "0.13"

# File system
walkdir = "2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

# App package parsing. zip 9 fixes three extraction advisories (GHSA-4v9h-p7m9-rh26,
# GHSA-vv5m-jxxh-4627, GHSA-4684-h2q9-2vcp); its maintainer then yanked every
# earlier release. We never call `extract`, but the older versions no longer resolve.
zip = "9"
roxmltree = "0.21"
# Large dependency entries (a Ready-to-Run package's nested app, a
# SymbolReference.json) are decompressed into an anonymous temp file instead of
# one big heap buffer; a read-only memory map of that file does not count
# against Windows commit. See `src/capped_io.rs`.
tempfile = "3"
memmap2 = "0.9"

# Home directory (cross-platform)
dirs = "7"

# Logging
log = "0.4"
env_logger = "0.11"

# URL decoding
percent-encoding = "2"

# Insertion-ordered map (used in format_terminal rollup groups + the cli-b CBOR
# encoder's insertion-ordered value model).
indexmap = "2"

# gzip for the cli-b `.cbor.gz` snapshot serializer. zlib-ng (vendored) so the
# DEFLATE stream is byte-stable across hosts and matches Bun's gzip output at
# level 6. The gzip OS header byte is normalized to 0x03 by the serializer.
flate2 = { version = "1", default-features = false, features = ["zlib-ng"] }

# Error handling
anyhow = "1"

# Incremental query framework (L4 incrementality, Phase R3b). PINNED exactly (moved
# 0.27.0 -> 0.28.5 on 2026-10-16) to a stable crates.io release (the new-Salsa `#[salsa::db]` / `#[salsa::input]`
# / `#[salsa::tracked]` / `#[salsa::interned]` API). The interning + cycle-handling
# behavior differs materially across Salsa versions — keep this pinned.
salsa = "=0.28.5"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Telemetry pipeline (only pulled in when the `telemetry` feature is on).
# Versions move as ONE set: opentelemetry-application-insights 0.46 depends on
# opentelemetry / opentelemetry_sdk / opentelemetry-http 0.33, and
# tracing-opentelemetry 0.34 is the bridge for opentelemetry 0.33. A mismatch
# pulls a second copy of the crate and breaks the trait bounds at the
# global::set_tracer_provider call site.
opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio-current-thread"], optional = true }
opentelemetry-http = { version = "0.33", features = ["reqwest-blocking"], optional = true }
opentelemetry-application-insights = { version = "0.46", optional = true }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }
lru = { version = "0.18", optional = true }
# TLS through rustls on `ring`, as reqwest 0.12 had it. reqwest 0.13's `rustls`
# feature brings `aws-lc-rs`, whose C is built with `_GNU_SOURCE` and binds
# `strtol` to glibc 2.38's `__isoc23_strtol`: the Linux release binary then
# fails the glibc 2.34 floor in build-and-deploy.yml. `rustls-no-provider` +
# `rustls/ring` keeps the C-free crypto; the exporter installs the provider.
reqwest = { version = "0.13", features = ["blocking", "rustls-no-provider"], default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }

[features]
default = ["telemetry"]
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-http",
    "dep:opentelemetry-application-insights",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-opentelemetry",
    "dep:lru",
    "dep:reqwest",
    "dep:rustls",
]
# Exposes a counters-only runtime installer for integration tests so they can
# assert on `record_*` calls without spinning up the real exporter. Implies
# `telemetry`.
test-runtime = ["telemetry"]

[dev-dependencies]
criterion = "0.8"
# Dual-run parity harness (owned-syntax-IR migration): integration tests link only
# the crate + dev-deps, so the IR crate + a dir walker are listed here too.
al-syntax = { path = "crates/al-syntax" }
walkdir = "2"
# Already a normal dependency (see [dependencies] above) — re-listed here so the
# `l4_summary_differential` integration test can SHA-256 the CDO whole-program
# frozen baseline (too large to commit readably; frozen as a digest). Not a new
# crate in the tree.
sha2 = "0.11"

[[bin]]
name = "telemetry-spike"
path = "tools/telemetry-spike/main.rs"
required-features = ["telemetry"]

# The call-hierarchy LSP server. Named EXPLICITLY (rather than inherited from the
# package name, as it was before the crate became `al-sem`) because the binary name is
# an external contract: `.github/workflows/build-and-deploy.yml` copies it into the three
# `claude-code-lsps/al-language-server-go*` packages, and the `al-language-server-python`
# wrapper spawns it. Renaming it would break those; renaming the crate does not.
[[bin]]
name = "al-call-hierarchy"
path = "src/main.rs"

# R0 differential-harness producer — emits the object/routine identity subset
# as JSON for the Rust-port parity check. Additive; not part of the LSP surface.
[[bin]]
name = "aldump"
path = "src/bin/aldump.rs"

# The future al-sem production CLI (Rust port). Stage 1: the `analyze` GATE path
# (projection + filters + SARIF) byte-matching the al-sem TS gate goldens. Additive;
# separate from `aldump` and the LSP surface.
[[bin]]
name = "alsem"
path = "src/bin/alsem.rs"

# DEV-ONLY tool (engine-switch S9.0d): mints the committed, anonymized
# semantic-edges goldens under `tests/goldens/semantic-edges/`
# (`cdo-compiler-anon.json`, `fixture-compiler-anon.json`) from the AL
# compiler's call graph (`scripts/compiler-graph`), plus the gitignored local
# de-anon map. Never part of the LSP surface or any release artifact.
[[bin]]
name = "mint-goldens"
path = "src/bin/mint-goldens.rs"

[[bench]]
name = "telemetry_hot_path"
harness = false

# T0.5: the legacy LSP call-hierarchy pipeline (initial index, the 3
# call-hierarchy query handlers, single-file reindex) — the surface
# CLAUDE.md's Performance Targets table describes.
[[bench]]
name = "lsp_pipeline"
harness = false

# T3 (LSP-migration arc) Task 3: program-engine stage split (snapshot / parse
# / build(graph) / ResolveIndex::build / BodyMap::build) over the perf
# corpus — pins the rung-1/rung-2 incremental-updater budgets.
[[bench]]
name = "engine_stages"
harness = false

# The dependency pack format's go/no-go gate (spec §13). `harness = false`: a
# plain `main` measuring the hit-path SHAPE end to end, not a criterion
# micro-benchmark. Needs `PACK_BENCH_WS` pointed at a real BC workspace and
# exits non-zero without it.
[[bench]]
name = "dep_pack_roundtrip"
harness = false
# `test = false` is LOAD-BEARING, not tidiness. `cargo test` builds and RUNS every
# `harness = false` bench target, and this one exits 2 when `PACK_BENCH_WS` is unset —
# deliberately, so a missing workspace can never read as a passing gate. Without this
# line every CI run fails, because CI never has that variable. The sibling criterion
# benches survive `cargo test` only because criterion detects it and self-limits to one
# iteration; this bench is a plain `fn main`, so it cannot.
# `clippy --all-targets` still lints it, so the `-D warnings` bar is unaffected.
test = false

# Dev and test builds keep file:line debug info (panics and backtraces still name the
# line) but not full variable info, and dependencies keep none. Full debug info for
# every test executable made `target/debug/deps` hold 19 GB of .pdb files on Windows
# (2026-10-14) and helped fill U: during a merge's post-merge check. For a step-debugger
# session that needs locals, override once:
# `CARGO_PROFILE_DEV_DEBUG=full cargo test ...`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 4

# Optimized but fast to REBUILD: for correctness runs on CDO (`scripts/cdo-gate`, the
# `aldump` unknown-count loop), never for timing or memory numbers — use
# `release-fast` or `release` for those. No LTO, many codegen units and incremental
# compilation trade some runtime speed for a much shorter edit-rebuild cycle.
[profile.cdo]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

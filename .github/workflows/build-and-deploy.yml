name: Build and Deploy Binaries

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'crates/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch:  # Allow manual trigger

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: no binary is deployed unless the test suite passes against the
  # tree-sitter-al grammar it is built with (same gate as release.yml).
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout al-call-hierarchy
        uses: actions/checkout@v4

      - name: Checkout tree-sitter-al
        uses: actions/checkout@v4
        with:
          repository: SShadowS/tree-sitter-al
          path: tree-sitter-al

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        # Debug build: validates the same logic against the grammar far faster
        # than --release. The shipped binaries are still built in release by the
        # build jobs below; this gate only needs the tests to pass.
        #
        # `scripts/ci-steps test` (= `cargo test --workspace`), NOT
        # `cargo test --all-targets`. `--all-targets` selects BENCH targets
        # explicitly, which overrides the `test = false` on
        # `benches/dep_pack_roundtrip` — that bench is a plain `fn main` and exits
        # 2 when `PACK_BENCH_WS` is unset, deliberately, so a missing workspace can
        # never read as a passing gate. CI never has that variable, so
        # `--all-targets` failed this job on every push. Routing through ci-steps
        # also keeps one source of truth for the command and gets the
        # grammar-checkout guard for free.
        run: scripts/ci-steps test

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write  # OIDC for azure/login (signing)
    # Federated credential matches subject repo:...:environment:release
    environment: release
    steps:
      - name: Checkout al-call-hierarchy
        uses: actions/checkout@v4

      - name: Checkout tree-sitter-al
        uses: actions/checkout@v4
        with:
          repository: SShadowS/tree-sitter-al
          path: tree-sitter-al

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        run: cargo build --release

      # Authenticode-sign via Azure Artifact Signing (Trusted Signing).
      # Same config as release.yml: vars AZURE_SIGNING_ENDPOINT /
      # AZURE_SIGNING_ACCOUNT / AZURE_SIGNING_PROFILE, secrets AZURE_TENANT_ID /
      # AZURE_CLIENT_ID / AZURE_SUBSCRIPTION_ID. Steps SKIP until configured.
      # This is the path that COMMITS binaries into al-lsp-for-agents plugin
      # dirs (Claude Code marketplace ships them straight from that repo), so
      # signing here is what gets marketplace users a signed exe.
      - name: Azure login
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows binary
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          # The action requires rooted (absolute) paths. `cargo build --release`
          # builds every binary, so `alsem.exe` (the analyzer CLI the Go wrapper
          # plugins also ship) is signed and deployed from this same build — it
          # used to be built and signed by hand, which needed a local `az login`.
          files: |
            ${{ github.workspace }}\target\release\al-call-hierarchy.exe
            ${{ github.workspace }}\target\release\alsem.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: al-call-hierarchy-windows
          path: |
            target/release/al-call-hierarchy.exe
            target/release/alsem.exe

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout al-call-hierarchy
        uses: actions/checkout@v4

      - name: Checkout tree-sitter-al
        uses: actions/checkout@v4
        with:
          repository: SShadowS/tree-sitter-al
          path: tree-sitter-al

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        run: cargo build --release

      # `alsem` for the Linux Go wrapper plugin, built WITHOUT the default
      # `telemetry` feature — the same way the hand-built binary it replaces was.
      # Overwrites the default-feature `alsem` from the step above; the
      # `al-call-hierarchy` binary is untouched.
      - name: Build alsem (no telemetry)
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        run: cargo build --release --no-default-features --bin alsem

      # The shipped Linux binaries must run on glibc 2.34 (e.g. Ubuntu 22.04).
      # A runner-image upgrade can raise the floor silently; fail here instead.
      - name: Check glibc floor
        run: |
          set -euo pipefail
          for b in target/release/al-call-hierarchy target/release/alsem; do
            v=$(objdump -T "$b" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
            echo "$b needs glibc $v"
            if [ "$(printf '%s\n2.34\n' "$v" | sort -V | tail -1)" != "2.34" ]; then
              echo "::error::$b needs glibc $v (> 2.34)"; exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: al-call-hierarchy-linux
          path: |
            target/release/al-call-hierarchy
            target/release/alsem

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout al-call-hierarchy
        uses: actions/checkout@v4

      - name: Checkout tree-sitter-al
        uses: actions/checkout@v4
        with:
          repository: SShadowS/tree-sitter-al
          path: tree-sitter-al

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build for x86_64
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Build for aarch64 (Apple Silicon)
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/al-call-hierarchy \
            target/aarch64-apple-darwin/release/al-call-hierarchy \
            -output al-call-hierarchy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: al-call-hierarchy-macos
          path: al-call-hierarchy

  # The deploy target is a SEPARATE repo (SShadowS/al-lsp-for-agents, whose local
  # checkout is still named claude-code-lsps) and needs a
  # PAT with write access there, stored as the CLAUDE_CODE_LSPS_TOKEN secret.
  # When the secret is absent, deploy SKIPS (builds above still gate every push)
  # instead of failing the workflow at the checkout step — add the secret and
  # deployment resumes with no workflow change. The presence check lives in its
  # own job because the `secrets` context is NOT available in job-level `if`
  # (it would silently evaluate empty and skip even with the secret set); step
  # expressions CAN read it, and `needs` outputs CAN gate a job.
  deploy-gate:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    outputs:
      have_token: ${{ steps.chk.outputs.have }}
    steps:
      - id: chk
        run: echo "have=${{ secrets.CLAUDE_CODE_LSPS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [deploy-gate]
    if: needs.deploy-gate.outputs.have_token == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: al-call-hierarchy-windows
          path: binaries/windows

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: al-call-hierarchy-linux
          path: binaries/linux

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: al-call-hierarchy-macos
          path: binaries/macos

      - name: Checkout al-lsp-for-agents
        uses: actions/checkout@v4
        with:
          # SShadowS/claude-code-lsps redirects here, but a redirect only lasts until
          # something claims the old name — resolve it explicitly.
          repository: SShadowS/al-lsp-for-agents
          token: ${{ secrets.CLAUDE_CODE_LSPS_TOKEN }}
          path: claude-code-lsps

      - name: Copy binaries to plugin directories
        # The copy map mirrors the target repo's ACTUAL layout (verified 2026-07-18):
        # al-call-hierarchy ships in exactly three places — the Windows and Linux Go
        # wrappers plus the generic al-language-server-go plugin (Windows flavor).
        # The repo has NO python wrapper and NO darwin plugin; the macOS universal
        # binary is still built and kept as a workflow artifact above, but there is
        # nowhere to deploy it until such a plugin exists. If the layout grows, add
        # the target here — a cp to a nonexistent dir fails the job loudly by design.
        run: |
          set -euo pipefail

          # Windows — Go wrapper + generic go plugin
          cp binaries/windows/al-call-hierarchy.exe claude-code-lsps/al-language-server-go-windows/bin/
          cp binaries/windows/al-call-hierarchy.exe claude-code-lsps/al-language-server-go/bin/

          # Linux — Go wrapper
          cp binaries/linux/al-call-hierarchy claude-code-lsps/al-language-server-go-linux/bin/
          chmod +x claude-code-lsps/al-language-server-go-linux/bin/al-call-hierarchy

          # alsem — ships only in the two Go wrapper plugins
          cp binaries/windows/alsem.exe claude-code-lsps/al-language-server-go-windows/bin/
          cp binaries/linux/alsem claude-code-lsps/al-language-server-go-linux/bin/
          chmod +x claude-code-lsps/al-language-server-go-linux/bin/alsem

      - name: Commit and push
        working-directory: claude-code-lsps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update al-call-hierarchy and alsem binaries from ${{ github.repository }}@${{ github.sha }}"
            git push
          fi

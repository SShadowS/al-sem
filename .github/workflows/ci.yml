name: CI

on:
  push:
    branches: [main, master]
    # Docs-only pushes skip the ~16-min suite. paths-ignore only skips when EVERY
    # changed file matches, so any commit touching code still runs the full gate.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout al-call-hierarchy
        uses: actions/checkout@v4

      - name: Checkout tree-sitter-al
        uses: actions/checkout@v4
        with:
          repository: SShadowS/tree-sitter-al
          path: tree-sitter-al

      - name: Install Rust
        # `@stable` installs a base stable + rustfmt/clippy; the actual version every
        # `cargo` command runs under is pinned by rust-toolchain.toml (rustup override),
        # so that file stays the single source of truth.
        uses: dtolnay/rust-toolchain@stable

      # Caches the registry and the dependency builds of the profiles this job uses
      # (dev for test, release-check for lint; the `release` job caches its own),
      # keyed on Cargo.lock, the toolchain and the job id. Without it every PR rebuilt the whole dependency tree several
      # times (Lint 1m24, Build 3m39, Perf bounds 3m38 on #174). Workspace crates are
      # never cached, so the code under test is always built fresh.
      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: scripts/ci-steps fmt

      - name: Lint
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        # `--all-targets` is load-bearing, not decorative (t3.16 review
        # fix-wave finding): without it, clippy never compiles ANY test or
        # bench crate at all — every `tests/*.rs`/`benches/*.rs` file (this
        # includes the `#[cfg(not(debug_assertions))]`-gated release_checks
        # module in `tests/perf_bounds.rs`, but is NOT specific to it — the
        # gap applied to every test/bench target regardless of cfg) went
        # completely unlinted by CI before this fix, `--release` alone was
        # never the missing piece. Matches CLAUDE.md's documented lint bar.
        run: scripts/ci-steps clippy

      - name: Generated vocab is fresh
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        run: scripts/ci-steps gen-syntax

      - name: Install cargo-nextest
        # v2.87.23, pinned by commit
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7
        with:
          tool: cargo-nextest

      - name: Test
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        run: scripts/ci-steps test

  # The release build and perf bounds run in their own job, beside `test`, instead of
  # after it: one job ran fmt, lint, test, build and perf one after another (~6.5 min of
  # steps, measured 2026-10-21 on run 39625785855: Lint 32 s, Test 100 s, Build 202 s,
  # Perf 41 s). Each job has its own rust-cache entry (the key includes the job id).
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout al-call-hierarchy
        uses: actions/checkout@v4

      - name: Checkout tree-sitter-al
        uses: actions/checkout@v4
        with:
          repository: SShadowS/tree-sitter-al
          path: tree-sitter-al

      - name: Install Rust
        # Version pinned by rust-toolchain.toml; see the `test` job.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        run: scripts/ci-steps build

      - name: Perf bounds (release-only; 3x CLAUDE.md targets, T0.5)
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        # Reuses the release build above (same profile, same target/ dir) —
        # this only compiles+links the test binary. The bounds checks are
        # `#[cfg(not(debug_assertions))]`-gated in tests/perf_bounds.rs, so
        # `--release` is what makes them compile in at all; see that file's
        # module doc for why a debug-build timing assert would be meaningless.
        run: scripts/ci-steps perf-bounds

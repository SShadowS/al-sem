name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: the release must not proceed if the test suite fails against the
  # tree-sitter-al grammar it is built with. Both build jobs depend on this, so
  # no binary is produced (and no release created) unless tests pass.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout al-call-hierarchy
        uses: actions/checkout@v4

      - name: Checkout tree-sitter-al
        uses: actions/checkout@v4
        with:
          repository: SShadowS/tree-sitter-al
          path: tree-sitter-al

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        # Debug build: validates the same logic against the grammar far faster
        # than --release. The shipped binaries are still built in release by the
        # build jobs below; this gate only needs the tests to pass.
        #
        # `scripts/ci-steps test` (= `cargo test --workspace`), NOT
        # `cargo test --all-targets`. `--all-targets` selects BENCH targets
        # explicitly, which overrides the `test = false` on
        # `benches/dep_pack_roundtrip` — that bench is a plain `fn main` and exits
        # 2 when `PACK_BENCH_WS` is unset, deliberately, so a missing workspace can
        # never read as a passing gate. CI never has that variable, so
        # `--all-targets` failed this job on every push. Routing through ci-steps
        # also keeps one source of truth for the command and gets the
        # grammar-checkout guard for free.
        run: scripts/ci-steps test

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write  # OIDC for azure/login (signing)
    # Federated credential matches subject repo:...:environment:release
    environment: release
    steps:
      - name: Checkout al-call-hierarchy
        uses: actions/checkout@v4

      - name: Checkout tree-sitter-al
        uses: actions/checkout@v4
        with:
          repository: SShadowS/tree-sitter-al
          path: tree-sitter-al

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        run: cargo build --release

      # Standalone `alsem` release asset, built WITHOUT the default `telemetry`
      # feature: consumers such as bc-dev-mcp download and run it unattended, so
      # it must not phone home. Overwrites the default-feature `alsem` from the
      # step above; `al-call-hierarchy.exe` is untouched.
      - name: Build alsem (no telemetry)
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        run: cargo build --release --no-default-features --bin alsem

      # Authenticode-sign via Azure Artifact Signing (Trusted Signing).
      # Steps SKIP cleanly until configured: repo vars AZURE_SIGNING_ENDPOINT /
      # AZURE_SIGNING_ACCOUNT / AZURE_SIGNING_PROFILE, secrets AZURE_TENANT_ID /
      # AZURE_CLIENT_ID / AZURE_SUBSCRIPTION_ID (OIDC federated credential).
      # Signing upstream here means every downstream consumer (al-lsp-for-agents
      # release zips, .vsix bundles, committed plugin binaries via
      # build-and-deploy.yml) ships a signed al-call-hierarchy.exe.
      - name: Azure login
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows binary
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          # The action requires rooted (absolute) paths
          files: |
            ${{ github.workspace }}\target\release\al-call-hierarchy.exe
            ${{ github.workspace }}\target\release\alsem.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: al-call-hierarchy-windows-x64
          path: |
            target/release/al-call-hierarchy.exe
            target/release/alsem.exe

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout al-call-hierarchy
        uses: actions/checkout@v4

      - name: Checkout tree-sitter-al
        uses: actions/checkout@v4
        with:
          repository: SShadowS/tree-sitter-al
          path: tree-sitter-al

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        run: cargo build --release

      # Standalone `alsem` release asset, no telemetry (see build-windows).
      - name: Build alsem (no telemetry)
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        run: cargo build --release --no-default-features --bin alsem

      # Same glibc 2.34 floor as build-and-deploy.yml (e.g. Ubuntu 22.04).
      - name: Check glibc floor
        run: |
          set -euo pipefail
          for b in target/release/al-call-hierarchy target/release/alsem; do
            v=$(objdump -T "$b" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
            echo "$b needs glibc $v"
            if [ "$(printf '%s\n2.34\n' "$v" | sort -V | tail -1)" != "2.34" ]; then
              echo "::error::$b needs glibc $v (> 2.34)"; exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: al-call-hierarchy-linux-x64
          path: |
            target/release/al-call-hierarchy
            target/release/alsem

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: al-call-hierarchy-windows-x64
          path: windows

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: al-call-hierarchy-linux-x64
          path: linux

      - name: Rename binaries
        run: |
          mv windows/al-call-hierarchy.exe al-call-hierarchy-windows-x64.exe
          mv linux/al-call-hierarchy al-call-hierarchy-linux-x64
          mv windows/alsem.exe alsem-windows-x64.exe
          mv linux/alsem alsem-linux-x64
          chmod +x al-call-hierarchy-linux-x64 alsem-linux-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            al-call-hierarchy-windows-x64.exe
            al-call-hierarchy-linux-x64
            alsem-windows-x64.exe
            alsem-linux-x64

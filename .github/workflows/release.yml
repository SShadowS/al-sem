name: Release

on:
  push:
    tags: ['v*']
  # TLS-117 (Fable N6): run by hand on a branch (`gh workflow run release.yml --ref <branch>`)
  # to see the Windows key checks pass before landing; the `release` job then skips.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: the release must not proceed if the test suite fails against the
  # tree-sitter-al grammar it is built with. Both build jobs depend on this, so
  # no binary is produced (and no release created) unless tests pass.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout al-call-hierarchy
        uses: actions/checkout@v4

      - name: Checkout tree-sitter-al
        uses: actions/checkout@v4
        with:
          repository: SShadowS/tree-sitter-al
          path: tree-sitter-al

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        # v2.87.23, pinned by commit; `ci-steps test` refuses to run without it
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7
        with:
          tool: cargo-nextest

      - name: Test
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        # Debug build: validates the same logic against the grammar far faster
        # than --release. The shipped binaries are still built in release by the
        # build jobs below; this gate only needs the tests to pass.
        #
        # `scripts/ci-steps test` (the whole workspace on nextest), NOT
        # `cargo test --all-targets`. `--all-targets` selects BENCH targets
        # explicitly, which overrides the `test = false` on
        # `benches/dep_pack_roundtrip` — that bench is a plain `fn main` and exits
        # 2 when `PACK_BENCH_WS` is unset, deliberately, so a missing workspace can
        # never read as a passing gate. CI never has that variable, so
        # `--all-targets` failed this job on every push. Routing through ci-steps
        # also keeps one source of truth for the command and gets the
        # grammar-checkout guard for free.
        run: scripts/ci-steps test

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write  # OIDC for azure/login (signing)
    # Federated credential matches subject repo:...:environment:release
    environment: release
    # TLS-117 (note section 4.3): every link writes a map file next to its output (lld-link
    # /MAP: deps\<name>.map, an MSVC bin having no hash suffix); /MAP only writes that file,
    # the image is unchanged.
    # The per-target variable is MERGED with .cargo/config.toml's target rustflags
    # (+crt-static stays); a plain RUSTFLAGS would replace them.
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C link-arg=/MAP"
    steps:
      - name: Checkout al-call-hierarchy
        uses: actions/checkout@v4

      - name: Checkout tree-sitter-al
        uses: actions/checkout@v4
        with:
          repository: SShadowS/tree-sitter-al
          path: tree-sitter-al

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        run: cargo build --profile release-ship

      # Standalone `alsem` release asset, built WITHOUT the default `telemetry`
      # feature: consumers such as bc-dev-mcp download and run it unattended, so
      # it must not phone home. Overwrites the default-feature `alsem` from the
      # step above; `al-call-hierarchy.exe` is untouched.
      - name: Build alsem (no telemetry)
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        run: cargo build --profile release-ship --no-default-features --bin alsem

      # TLS-117: write the IR cache's data-digest slot into the three binaries that install the
      # cache (an unstamped Windows binary gets no key: the cache is off for it), then verify
      # each. After the last build of each binary and before signing (signing changes no
      # section); a failure fails the job.
      - name: Stamp Windows binaries (IR cache data-digest slot)
        shell: pwsh
        run: |
          foreach ($b in 'alsem', 'aldump', 'al-call-hierarchy') {
            & target\release-ship\alsem-stamp.exe stamp "target\release-ship\$b.exe"
            if ($LASTEXITCODE -ne 0) { throw "stamping $b.exe failed" }
            & target\release-ship\alsem-stamp.exe verify "target\release-ship\$b.exe"
            if ($LASTEXITCODE -ne 0) { throw "verifying $b.exe failed" }
          }

      # Authenticode-sign via Azure Artifact Signing (Trusted Signing).
      # Steps SKIP cleanly until configured: repo vars AZURE_SIGNING_ENDPOINT /
      # AZURE_SIGNING_ACCOUNT / AZURE_SIGNING_PROFILE, secrets AZURE_TENANT_ID /
      # AZURE_CLIENT_ID / AZURE_SUBSCRIPTION_ID (OIDC federated credential).
      # Signing upstream here means every downstream consumer (al-lsp-for-agents
      # release zips, .vsix bundles, committed plugin binaries via
      # build-and-deploy.yml) ships a signed al-call-hierarchy.exe.
      - name: Azure login
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows binary
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          # The action requires rooted (absolute) paths
          files: |
            ${{ github.workspace }}\target\release-ship\al-call-hierarchy.exe
            ${{ github.workspace }}\target\release-ship\alsem.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # TLS-117 (sol r1 P1-3): the binaries as shipped (signed, when signing is configured)
      # still verify, and the shipped alsem.exe makes an IR cache key at run time: one analyze
      # of a tiny committed workspace with the cache on, judged by `--require-key` (an
      # `unstamped`, `unsupported` or `no key` line fails the job).
      - name: Check the shipped binaries' IR cache key
        shell: pwsh
        run: |
          foreach ($b in 'alsem', 'aldump', 'al-call-hierarchy') {
            & target\release-ship\alsem-stamp.exe verify "target\release-ship\$b.exe"
            if ($LASTEXITCODE -ne 0) { throw "verifying the shipped $b.exe failed" }
          }
          $env:ALSEM_IR_CACHE = 'on'
          $env:ALSEM_IR_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'ir-root'
          # judge(<report>, <rule>): the report must carry a key (`--require-key`) and pass <rule>
          function judge($rep, $rule) {
            python scripts/ir-cache-report-check --require-key --rule $rule $rep
            if ($LASTEXITCODE -ne 0) { throw "IR cache check failed: $rep ($rule)" }
          }
          $ws = 'tests\fixtures\tls117\ws'
          # cold: a fresh root; alsem.exe publishes
          $env:ALSEM_IR_CACHE_REPORT = Join-Path $env:RUNNER_TEMP 'ir-cold.jsonl'
          & target\release-ship\alsem.exe analyze $ws --format json | Out-Null
          if ($LASTEXITCODE -notin 0, 1) { throw "alsem analyze failed (exit $LASTEXITCODE)" }
          judge $env:ALSEM_IR_CACHE_REPORT output
          # warm: a second process hits what the first published
          $env:ALSEM_IR_CACHE_REPORT = Join-Path $env:RUNNER_TEMP 'ir-warm.jsonl'
          & target\release-ship\alsem.exe analyze $ws --format json | Out-Null
          if ($LASTEXITCODE -notin 0, 1) { throw "alsem analyze (warm) failed (exit $LASTEXITCODE)" }
          judge $env:ALSEM_IR_CACHE_REPORT warm-build
          # impact with every hit parsed again and compared (sol r-final: VERIFY on the
          # shipped artifacts): disk hits, all verified
          $env:ALSEM_IR_CACHE_VERIFY = '1'
          $env:ALSEM_IR_CACHE_REPORT = Join-Path $env:RUNNER_TEMP 'ir-impact.jsonl'
          & target\release-ship\alsem.exe impact $ws --routine 'Ws Cu::Run' --format json | Out-Null
          if ($LASTEXITCODE -notin 0, 1) { throw "alsem impact failed (exit $LASTEXITCODE)" }
          Remove-Item Env:ALSEM_IR_CACHE_VERIFY
          judge $env:ALSEM_IR_CACHE_REPORT impact
          # aldump.exe has its own key (its own bytes): it publishes into its own key folder
          $env:ALSEM_IR_CACHE_REPORT = Join-Path $env:RUNNER_TEMP 'ir-aldump.jsonl'
          & target\release-ship\aldump.exe --program-call-graph-stats $ws | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "aldump failed (exit $LASTEXITCODE)" }
          judge $env:ALSEM_IR_CACHE_REPORT output
          # the shipped LSP server at runtime (sol r-final): one real LSP request on stdio (a
          # didOpen alone builds nothing), then shutdown; its own key, publishing into its folder
          $env:ALSEM_IR_CACHE_REPORT = Join-Path $env:RUNNER_TEMP 'ir-lsp.jsonl'
          python scripts/lsp-key-smoke target\release-ship\al-call-hierarchy.exe $ws --no-telemetry
          if ($LASTEXITCODE -ne 0) { throw "the LSP smoke run failed (exit $LASTEXITCODE)" }
          judge $env:ALSEM_IR_CACHE_REPORT output

      # TLS-117 (Fable N5): the shipped alsem.exe links the C runtime statically
      # (`+crt-static`, .cargo/config.toml). The job's map rustflags must merge with it, not
      # replace it: a dynamic CRT import fails the job.
      - name: Check the static C runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' |
            Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found (vswhere)' }
          foreach ($b in 'alsem', 'aldump', 'al-call-hierarchy') {
            $deps = & $dumpbin /nologo /dependents "target\release-ship\$b.exe" | Out-String
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed on $b.exe" }
            Write-Output "== $b.exe"; Write-Output $deps
            if ($deps -match '(?i)vcruntime\d+\.dll|msvcp\d+\.dll|api-ms-win-crt-') {
              throw "$b.exe imports the dynamic C runtime: +crt-static was lost"
            }
          }

      # TLS-117 (note section 4.3): list every locale deny symbol each shipped binary's map
      # names, for a human to check against section 4.1 (expected: the static UCRT's own
      # copies, and tree-sitter's query parser if the link keeps it). A map says what was
      # linked, not what is reachable, so this never fails the job; a missing map warns.
      # No leading word boundary: `__acrt_LCMapStringW`, `_o_towlower`, `__imp_...` match.
      - name: List locale symbols in the link maps (for a human)
        shell: pwsh
        run: |
          $deny = '(setlocale|_create_locale|localeconv|isw[a-z_]*|iswctype|isprint|tow[a-z_]*|GetLocaleInfo\w*|LCMapString\w*|CompareStringEx|CompareStringW|GetStringType\w*|FoldString\w*)\b'
          foreach ($b in 'alsem', 'aldump', 'al_call_hierarchy') {
            # MSVC bins have no hash suffix in deps\ (`alsem.map`); keep `<name>-<hash>` too,
            # and never take `alsem_stamp`'s map for alsem's.
            $map = Get-ChildItem 'target\release-ship\deps' -Filter '*.map' -ErrorAction SilentlyContinue |
              Where-Object { $_.BaseName -eq $b -or $_.BaseName -like "$b-*" } |
              Sort-Object LastWriteTime | Select-Object -Last 1
            if (-not $map) { Write-Output "::warning::no link map for $b (lld-link /MAP)"; continue }
            $hits = @(Select-String -Path $map.FullName -Pattern $deny)
            Write-Output "== $b ($($map.Name)): $($hits.Count) deny-listed symbol lines"
            $hits | Select-Object -First 200 | ForEach-Object { $_.Line.Trim() }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: al-call-hierarchy-windows-x64
          path: |
            target/release-ship/al-call-hierarchy.exe
            target/release-ship/alsem.exe

  build-linux:
    needs: test
    # glibc 2.35: std's process spawn links pidfd_spawnp at GLIBC_2.39 when built on newer glibc.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout al-call-hierarchy
        uses: actions/checkout@v4

      - name: Checkout tree-sitter-al
        uses: actions/checkout@v4
        with:
          repository: SShadowS/tree-sitter-al
          path: tree-sitter-al

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        run: cargo build --profile release-ship

      # Standalone `alsem` release asset, no telemetry (see build-windows).
      - name: Build alsem (no telemetry)
        env:
          TREE_SITTER_AL_PATH: ${{ github.workspace }}/tree-sitter-al
        run: cargo build --profile release-ship --no-default-features --bin alsem

      # ENG-110: the IR cache keys on the running image; every shipped binary that uses it
      # must carry the image marker and need only libc and libgcc_s, with no locale symbols.
      - name: Check IR cache image
        run: |
          set -euo pipefail
          for b in alsem aldump al-call-hierarchy; do
            scripts/check-ir-image "target/release-ship/$b"
          done

      # Same glibc 2.34 floor as build-and-deploy.yml (e.g. Ubuntu 22.04).
      - name: Check glibc floor
        run: |
          set -euo pipefail
          for b in target/release-ship/al-call-hierarchy target/release-ship/alsem; do
            v=$(objdump -T "$b" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
            echo "$b needs glibc $v"
            if [ "$(printf '%s\n2.34\n' "$v" | sort -V | tail -1)" != "2.34" ]; then
              echo "::error::$b needs glibc $v (> 2.34)"; exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: al-call-hierarchy-linux-x64
          path: |
            target/release-ship/al-call-hierarchy
            target/release-ship/alsem

  release:
    needs: [build-windows, build-linux]
    # A manual run (workflow_dispatch, e.g. on a branch before landing) builds and checks
    # everything but publishes nothing.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: al-call-hierarchy-windows-x64
          path: windows

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: al-call-hierarchy-linux-x64
          path: linux

      - name: Rename binaries
        run: |
          mv windows/al-call-hierarchy.exe al-call-hierarchy-windows-x64.exe
          mv linux/al-call-hierarchy al-call-hierarchy-linux-x64
          mv windows/alsem.exe alsem-windows-x64.exe
          mv linux/alsem alsem-linux-x64
          chmod +x al-call-hierarchy-linux-x64 alsem-linux-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            al-call-hierarchy-windows-x64.exe
            al-call-hierarchy-linux-x64
            alsem-windows-x64.exe
            alsem-linux-x64

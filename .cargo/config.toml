# Faster linking: rust-lld ships with the MSVC toolchain and is far faster than
# link.exe. On Windows this mattered when there were 151 integration-test binaries;
# since the umbrella consolidation there are 14 test binaries + 5 [[bin]]s. (On Linux,
# Phase 0 of the crate split measured linking at 5% of a warm lib-test rebuild, 2026-11-10.)
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
# Link the C runtime statically so the exe does not need VCRUNTIME140.dll.
# Windows Server Core (e.g. BC containers) ships without the VC++
# redistributable, and a missing DLL kills the process before main() runs.
rustflags = ["-C", "target-feature=+crt-static"]

[profile.dev]
# Faster MSVC debuginfo handling (avoids monolithic PDB work per binary).
split-debuginfo = "packed"

# Compile dependencies (tree-sitter grammar, serde, regex, ...) with optimizations
# even in dev/test builds. Deps rarely change so this is a one-time cost, and it
# makes parse-heavy tests (al-syntax lowering over fixture corpora) several times
# faster at runtime.
[profile.dev.package."*"]
opt-level = 2

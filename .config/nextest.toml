# cargo-nextest configuration.
#
# Why nextest here: this crate has ~20 integration-test binaries (umbrella crates), and several
# mutate process-global state (std::env::set_var in the cli_a/cli_b differential
# tests). nextest's process-per-test execution model makes those safe by
# construction (no shared address space) while giving much better parallelism
# than libtest's per-binary threading.
#
# Note: nextest does NOT run doctests — `scripts/ci-steps test` runs
# `cargo test --doc` after it. `scripts/check-goldens` uses the `goldens` profile;
# `scripts/cdo-gate` stays on `cargo test` (measured slower here, 2026-10-18).

[profile.default]
# One slot per logical CPU; the CDO-gated tests skip by default so the suite is
# mostly CPU-bound parse/resolve work.
test-threads = "num-cpus"
# Fail fast locally but let already-running tests finish.
fail-fast = true
# Surface slow tests (parse-heavy differentials) without killing them.
slow-timeout = { period = "60s" }

# Start the slow binaries first. The r3 oracle tests (~10-12 s each, every one
# re-resolves every fixture) and the cli cross-app contract tests (15-19 s) used to
# be scheduled last, so the suite ended with a ~10 s tail of a few busy slots
# (measured 2026-10-19: 56-63 s wall for ~43 s of CPU per slot). Priority only
# reorders; every test still runs.
[[profile.default.overrides]]
filter = 'binary(r3) | binary(cli) | binary(r4)'
priority = 50

# A golden gate reports every stale family in one pass (scripts/check-goldens).
[profile.goldens]
fail-fast = false

[profile.ci]
fail-fast = false
retries = 0
failure-output = "immediate-final"
